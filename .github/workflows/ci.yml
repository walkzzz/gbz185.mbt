name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 2026-11-19：CDN 具体版本对象全 403，但 `binaries/latest` 与 `cores/core-latest` 可下载
  # （moonbit_shadow 实践验证；binding.latest => 200 实测）。待官方修复版本化对象后回锁。
  MOONBIT_VERSION: latest

jobs:
  check:
    name: moon check --deny-warn (4 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: moon check --deny-warn --target all
        run: moon check --deny-warn --target all

  contract:
    name: .mbti contract drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: moon info
        run: moon info
      - name: Fail on .mbti drift
        run: git diff --exit-code

  prove:
    name: moon prove (Why3 + Z3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y z3
      - name: moon prove
        run: moon prove

  test-native:
    name: moon test --target native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (unix, retry)
        if: runner.os != 'Windows'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: Install MoonBit (windows, explicit zip + core, retry)
        if: runner.os == 'Windows'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri "https://cli.moonbitlang.com/binaries/$env:MOONBIT_VERSION/moonbit-windows-x86_64.zip" -OutFile "$env:RUNNER_TEMP\moonbit.zip"
            Invoke-WebRequest -Uri "https://cli.moonbitlang.com/cores/core-$env:MOONBIT_VERSION.zip" -OutFile "$env:RUNNER_TEMP\core.zip"
            Expand-Archive -Path "$env:RUNNER_TEMP\moonbit.zip" -DestinationPath "$env:USERPROFILE\.moon" -Force
            New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.moon\lib" | Out-Null
            Expand-Archive -Path "$env:RUNNER_TEMP\core.zip" -DestinationPath "$env:USERPROFILE\.moon\lib" -Force
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.moon\bin"
            & "$env:USERPROFILE\.moon\bin\moon.exe" update
            if ($LASTEXITCODE -ne 0) { exit 1 }
            & "$env:USERPROFILE\.moon\bin\moon.exe" -C "$env:USERPROFILE\.moon\lib\core" bundle --warn-list -a --all
            if ($LASTEXITCODE -ne 0) { exit 1 }
            & "$env:USERPROFILE\.moon\bin\moon.exe" -C "$env:USERPROFILE\.moon\lib\core" bundle --warn-list -a --target wasm-gc --quiet
            if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: moon test --target native
        run: moon test --target native

  test-portable:
    name: moon test --target ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, wasm-gc]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: moon test --target ${{ matrix.target }}
        run: moon test --target ${{ matrix.target }}

  coverage:
    name: moon coverage analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: moon coverage analyze
        run: |
          set +e
          moon coverage analyze > coverage.log 2>&1
          RC=$?
          tail -25 coverage.log
          # 可见性优先：报告生成即通过；未覆盖行数不如硬门禁（新代码会波动）
          grep -q "Total: .*uncovered" coverage.log || { echo "::error::coverage report missing"; exit 1; }
          echo "coverage analyze exit code: $RC"
