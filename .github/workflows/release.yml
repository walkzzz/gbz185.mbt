name: Release (mooncakes)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE to confirm publishing"
        required: true

env:
  MOONBIT_VERSION: 0.1.20261104

jobs:
  publish:
    name: moon publish (walkzzz/gbz185.mbt)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'RELEASE'
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit + update registry (retry)
        uses: nick-fields/retry@v3
        with:
          retry_attempts: 3
          retry_max_time: 300
          command: |
            curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$MOONBIT_VERSION"
            echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
            "$HOME/.moon/bin/moon" update
      - name: moon check --deny-warn --target all (gate)
        run: moon check --deny-warn --target all
      - name: moon test
        run: moon test
      - name: moon publish --dry-run
        run: moon publish --dry-run
      - name: moon publish
        run: moon publish
        env:
          MOONCAKE_TOKEN: ${{ secrets.MOONCAKE_TOKEN }}
